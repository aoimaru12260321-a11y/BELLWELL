.trust-box{

.trust-box.reverse{

.trust-box img{

.service-grid{

.voice-box{

  line-height:1.8;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* FLOW */

.flow-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.flow-box{
  background:#fff;
  padding:18px 10px;

  border-radius:12px;
  font-size:13px;

.service-grid{

.service-card{

.voice-grid{

.flow-grid{

.contact-box{
  padding:35px 18px;

.site-logo img{
